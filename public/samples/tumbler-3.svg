<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE4D2D" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldTag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#bg3)" />
  <circle cx="400" cy="500" r="320" fill="#FFFFFF" opacity="0.1" filter="blur(40px)" />
  
  <!-- Flash Sale Graphic / Discount Ring -->
  <circle cx="400" cy="480" r="240" fill="#FFFFFF" />
  <text x="400" y="420" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#EE4D2D" text-anchor="middle">FLASH SALE</text>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="96" font-weight="900" fill="#EE4D2D" text-anchor="middle">฿259.-</text>
  <text x="400" y="580" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#94A3B8" text-decoration="line-through" text-anchor="middle">ปกติ ฿590</text>

  <!-- Big Promo Banner -->
  <rect x="150" y="800" width="500" height="110" rx="28" fill="url(#goldTag)" />
  <text x="400" y="865" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#854D0E" text-anchor="middle">🔥 ลดเกิน 50% + ส่งฟรี</text>

  <rect x="200" y="940" width="400" height="70" rx="35" fill="#FFFFFF" opacity="0.9" />
  <text x="400" y="988" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#1E293B" text-anchor="middle">🛒 จิ้มตะกร้าส้มด่วนเลย!</text>
</svg>
